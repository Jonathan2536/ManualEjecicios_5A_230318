<table mat-table [dataSource]="personas">
  <!-- Columna "Nombre" -->
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let persona"> {{ persona.nombre }} </td>
  </ng-container>

  <!-- Columna "Primer Apellido" -->
  <ng-container matColumnDef="primerApellido">
    <th mat-header-cell *matHeaderCellDef> Primer Apellido </th>
    <td mat-cell *matCellDef="let persona"> {{ persona.primerApellido }} </td>
  </ng-container>

  <!-- Columna "Segundo Apellido" -->
  <ng-container matColumnDef="segundoApellido">
    <th mat-header-cell *matHeaderCellDef> Segundo Apellido </th>
    <td mat-cell *matCellDef="let persona"> {{ persona.segundoApellido }} </td>
  </ng-container>

  <!-- Fila de encabezado -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <!-- Fila de datos -->
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
