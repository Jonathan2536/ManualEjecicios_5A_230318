<div class="container">
  <h1>Estado del Servidor</h1>
  @if (isServerRunning) {
    <p class="status-success">El servidor esta corriendo</p>
    @if (isLoggedIn) {
      <p>Bienvenido back, Jonathan Emmanuel López Morales</p>
    } @else {
      <p class="status-warning">Inicia sesion</p>
    }
  } @else {
    <p class="status-error">El sitio web está fuera de línea</p>
  }
</div>
