<div *ngIf="isLoggedIn; else showLogin">
  <!-- Si el usuario está logueado -->
  <app-navbar [userName]="userName" (logout)="onLogout()"></app-navbar>
  <div class="main-container">
    <app-page-container></app-page-container>
    <router-outlet></router-outlet>
  </div>
</div>

<ng-template #showLogin>
  <!-- Aquí puedes agregar tu componente de login o cualquier mensaje si el usuario no está logueado -->
  <app-login (loginSuccess)="onLoginSuccess($event)"></app-login>
</ng-template>
